name: CI

# TESTOPS-15. The floor is a property of the repository, not of the Lead's memory: the suite runs on
# the interpreter that serves the UI (3.11) and on the one a developer is most likely to have (3.12).
#
# Cost: three jobs per run (two matrix legs plus the render check), each rounded up to the nearest
# billed minute, so ~3 minutes per run on a private repository. A superseded run is cancelled by the
# concurrency group below and is billed only for the time it had already used.

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main, "feature/*"]

concurrency:
  # One run per branch (or PR) at a time: a second push cancels the first instead of queueing a
  # second full matrix. Keyed on the ref, so two PRs never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: "1"

jobs:
  identifiers:
    # TESTOPS-102 AC6. Its own job, so a commit that reintroduces a subscription id, a home path, a
    # tailnet address or a credential fails a check called "no identifiers" and not a test among
    # fourteen hundred. No install step: the check is stdlib plus the repository's own screen.
    name: no identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scan the tracked tree
        run: env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV -u CONDA_PREFIX PYTHONNOUSERSITE=1 \
             python scripts/check_no_secrets.py

  suite:
    # The interpreter is in the check's own name, so a red check on a PR says which floor broke
    # without anyone opening the Actions tab (AC4).
    name: suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run the suite the way tests/README.md says to
        shell: bash
        run: |
          set -o pipefail
          # The same command a developer runs locally, with the interpreter from the matrix in
          # place of .venv/Scripts/python.exe. The environment is stripped for the same reason:
          # an inherited PYTHONPATH makes the result an environment error, not a pass.
          #
          # TESTOPS-53: this run includes tests/contracts. That suite starts and owns a server on
          # an ephemeral port over a disposable store built under the runner's temp directory, so
          # it reads and writes nothing the product is running from.
          env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV -u CONDA_PREFIX PYTHONNOUSERSITE=1 \
            python -m pytest -q | tee "$RUNNER_TEMP/pytest-${{ matrix.python }}.log"

      - name: Page-contract gate (the suite's own temporary server and store)
        shell: bash
        run: |
          set -o pipefail
          # TESTOPS-53 AC5. The page promises are a gate, not a report: this step is named on its
          # own so a red check says which promises broke, and a non-zero exit fails the build.
          # TESTOPS-54/55 own the promises still red at the time of writing (P5, P7, P10); this
          # step stays red until they land - that is the point.
          env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV -u CONDA_PREFIX PYTHONNOUSERSITE=1 \
            python -m pytest tests/contracts -q | tee "$RUNNER_TEMP/contracts-${{ matrix.python }}.log"

      - name: Status line naming the interpreter
        if: always()
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### pytest on Python ${PYTHON_VERSION}: ${JOB_STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the failing interpreter and the failing tests
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/pytest-${{ matrix.python }}.log"
          {
            echo ""
            echo "#### suite (Python ${{ matrix.python }}) failed"
            echo ""
            if [ -f "$log" ]; then
              grep -E '^(FAILED|ERROR)' "$log" \
                || echo 'pytest reported no FAILED/ERROR lines; see the step log.'
            else
              echo 'pytest never ran: the install or setup step failed first. See the step log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$log" ] && grep -qE '^(FAILED|ERROR)' "$log"; then
            while IFS= read -r line; do
              echo "::error title=suite (Python ${{ matrix.python }})::${line}"
            done < <(grep -E '^(FAILED|ERROR)' "$log")
          else
            echo "::error title=suite (Python ${{ matrix.python }})::the suite did not run or reported nothing; see this job's log"
          fi

  render:
    # AC3: import and render, not compile. `from itertools import batched` compiles cleanly on 3.11
    # and raises at import, which is past both sides of the compile guard in test_python_floor.py.
    name: render case page (Python 3.11)
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Import the app and serve one real case page from the store fixture
        run: |
          env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV -u CONDA_PREFIX PYTHONNOUSERSITE=1 \
            python .github/ci/render_case_page.py
