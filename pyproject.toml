[project]
name = "testops"
version = "0.1.0"
description = "Evidence-backed analysis of a repository pair"
requires-python = ">=3.11"
dependencies = []

# Development install (documented in tests/README.md):
#   pip install -e ".[dev]"
[project.optional-dependencies]
# setuptools and wheel are the build backend the distribution test uses with
# --no-build-isolation, so building a wheel needs no network.
dev = ["pytest>=8", "setuptools>=68", "wheel"]

[tool.setuptools]
# Every entry must be a package that exists on disk. `testops.cases` is a module (testops/cases.py),
# not a package, and naming it here made an editable install import-fail; `testops.web` and
# `testops.scripts` are packages and must be named or the UI is absent from the install.
packages = ["testops", "testops.store", "testops.collectors", "testops.extract",
            "testops.surfaces", "testops.analysers", "testops.judgement",
            "testops.score", "testops.web", "testops.scripts"]

[tool.setuptools.package-data]
"testops" = ["store/schema.sql", "judgement/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# TESTOPS-8 AC4: the distribution check is in the ordinary suite and reaches no network, but it
# builds a wheel and a venv (~20s), so the fast lane skips it by name and CI runs everything.
markers = ["distribution: builds a wheel, installs it into a fresh venv and serves pages from it; needs no network, takes ~20s"]